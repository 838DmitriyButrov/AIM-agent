[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-audit-agents"
version = "0.2.4"
description = "Evidence-first Russian website LEGAL and AI Search/GEO auditors"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "pydantic>=2,<3"]

[project.optional-dependencies]
ai = ["openai>=1.50"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
browser = ["playwright>=1.45"]
test = ["pytest>=8"]

[project.scripts]
siteaudit = "siteaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
siteaudit = ["data/*.json"]
